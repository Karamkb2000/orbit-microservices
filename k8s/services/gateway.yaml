apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: orbit
  labels: { app: gateway, tier: edge }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, tier: edge }
    spec:
      containers:
        - name: gateway
          image: orbit-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: PORT, value: "8080" }
            - { name: AUTH_URL, value: http://auth:4001 }
            - { name: CATALOG_URL, value: http://catalog:4002 }
            - { name: CART_URL, value: http://cart:4003 }
            - { name: ORDERS_URL, value: http://orders:4004 }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: orbit
spec:
  selector: { app: gateway }
  ports: [ { port: 8080, targetPort: 8080 } ]
