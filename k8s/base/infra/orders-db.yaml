apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-db
  namespace: orbit
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: orbit
  labels:
    app: orders-db
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: orders-db
        tier: data
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: orbit-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: orders
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orbit"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orders-db
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: orbit
spec:
  selector:
    app: orders-db
  ports:
    - port: 5432
      targetPort: 5432
