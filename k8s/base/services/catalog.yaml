apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: orbit
  labels: { app: catalog, tier: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels: { app: catalog, tier: api }
    spec:
      containers:
        - name: catalog
          image: orbit-catalog:latest
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 4002 } ]
          env:
            - { name: PORT, value: "4002" }
            - { name: PGHOST, value: catalog-db }
            - { name: PGDATABASE, value: catalog }
            - name: PGUSER
              valueFrom: { configMapKeyRef: { name: orbit-config, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: orbit-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: orbit
spec:
  selector: { app: catalog }
  ports: [ { port: 4002, targetPort: 4002 } ]
