apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: orbit
  labels: { app: orders, tier: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders, tier: api }
    spec:
      containers:
        - name: orders
          image: orbit-orders:latest
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 4004 } ]
          env:
            - { name: PORT, value: "4004" }
            - { name: PGHOST, value: orders-db }
            - { name: PGDATABASE, value: orders }
            - name: PGUSER
              valueFrom: { configMapKeyRef: { name: orbit-config, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: orbit-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: orbit-secrets, key: JWT_SECRET } }
            - name: RABBITMQ_URL
              value: amqp://orbit:orbit@broker:5672
          readinessProbe:
            httpGet: { path: /health, port: 4004 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4004 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: orbit
spec:
  selector: { app: orders }
  ports: [ { port: 4004, targetPort: 4004 } ]
