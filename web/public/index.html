<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b5bf0" />
    <title>Orbit — Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 1 10 10M12 22A10 10 0 0 1 2 12"/></svg>
        </span>
        Orbit
      </div>
      <div class="top-actions">
        <button id="cart-btn" class="icon-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          <span id="cart-count" class="cart-count">0</span>
        </button>
        <span id="user-area"></span>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Gear for people who build.</h1>
        <p>A tiny storefront powered by six microservices.</p>
      </section>
      <section id="products" class="grid"></section>
    </main>

    <aside id="cart-drawer" class="drawer">
      <div class="drawer-head">
        <h2>Your cart</h2>
        <button id="cart-close" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="cart-items" class="cart-items"></div>
      <div class="drawer-foot">
        <div class="total-row"><span>Total</span><span id="cart-total">$0.00</span></div>
        <button id="checkout" class="btn btn-block">Place order</button>
      </div>
    </aside>
    <div id="overlay" class="overlay"></div>

    <div id="auth-modal" class="modal">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="auth-title">Sign in</h2>
          <button id="auth-close" class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="auth-form" class="auth-form">
          <input id="auth-name" type="text" placeholder="Name" autocomplete="name" />
          <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required />
          <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required />
          <p id="auth-error" class="error"></p>
          <button type="submit" class="btn btn-block" id="auth-submit">Sign in</button>
        </form>
        <p class="auth-switch">
          <span id="auth-switch-text">New here?</span>
          <a id="auth-switch" href="#">Create an account</a>
        </p>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>
    <footer class="footer">Orbit · gateway → auth · catalog · cart · orders → notifications</footer>

    <script src="app.js"></script>
  </body>
</html>
