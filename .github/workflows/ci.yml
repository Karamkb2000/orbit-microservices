name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, catalog, cart, orders, notifications]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package.json
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: npm install
      - name: Syntax check
        working-directory: services/${{ matrix.service }}
        run: for f in src/*.js; do node --check "$f"; done
      - name: Docker build
        run: docker build -t orbit-${{ matrix.service }}:ci ./services/${{ matrix.service }}

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orbit-web:ci ./web

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
